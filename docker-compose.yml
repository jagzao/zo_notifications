version: '3.8'

services:
  # API REST
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: zo_notifications_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - API_PORT=3000
      - API_KEY_SECRET=${API_KEY_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - MAX_REQUEST_SIZE=${MAX_REQUEST_SIZE:-10mb}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - WEB_PUSH_PUBLIC_KEY=${WEB_PUSH_PUBLIC_KEY}
      - WEB_PUSH_PRIVATE_KEY=${WEB_PUSH_PRIVATE_KEY}
      - WEB_PUSH_EMAIL=${WEB_PUSH_EMAIL}
    depends_on:
      - redis
      - postgres
    networks:
      - zo_network
    volumes:
      - ./api/logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend - React Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zo_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
      - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:3000}
      - VITE_WEB_PUSH_PUBLIC_KEY=${WEB_PUSH_PUBLIC_KEY}
    depends_on:
      - api
    networks:
      - zo_network
    volumes:
      - ./frontend/src:/app/src  # Hot reload en desarrollo

  # Worker para Web Push Notifications
  webpush-worker:
    build:
      context: ./workers/webpush-worker
      dockerfile: Dockerfile
    container_name: zo_webpush_worker
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - WEB_PUSH_PUBLIC_KEY=${WEB_PUSH_PUBLIC_KEY}
      - WEB_PUSH_PRIVATE_KEY=${WEB_PUSH_PRIVATE_KEY}
      - WEB_PUSH_EMAIL=${WEB_PUSH_EMAIL}
      - MAX_PUSH_PER_HOUR=${MAX_PUSH_PER_HOUR:-10}
      - QUIET_HOURS_START=${QUIET_HOURS_START:-22}
      - QUIET_HOURS_END=${QUIET_HOURS_END:-7}
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - redis
      - postgres
    networks:
      - zo_network
    volumes:
      - ./workers/webpush-worker/logs:/app/logs

  # Worker para Discord
  discord-worker:
    build:
      context: ./workers/discord-worker
      dockerfile: Dockerfile
    container_name: zo_discord_worker
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - DISCORD_ERROR_ROLE_ID=${DISCORD_ERROR_ROLE_ID}
      - DISCORD_USERNAME=${DISCORD_USERNAME:-ZO Notifications}
      - DISCORD_AVATAR_URL=${DISCORD_AVATAR_URL}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - redis
    networks:
      - zo_network
    volumes:
      - ./workers/discord-worker/logs:/app/logs

  # Redis - Queue System
  redis:
    image: redis:7-alpine
    container_name: zo_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - zo_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL - Database
  postgres:
    image: postgres:15-alpine
    container_name: zo_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    networks:
      - zo_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx - Reverse Proxy (opcional, descomentar si necesitas SSL/TLS)
  # nginx:
  #   image: nginx:alpine
  #   container_name: zo_nginx
  #   restart: unless-stopped
