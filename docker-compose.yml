  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - api
  #   networks:
  #     - zo_network

  # Ntfy - Self-hosted (opcional, descomentar si no usas ntfy.sh público)
  # ntfy:
  #   image: binwiederhier/ntfy:latest
  #   container_name: zo_ntfy
  #   restart: unless-stopped
  #   command: serve
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ntfy_data:/var/cache/ntfy
  #     - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
  #   networks:
  #     - zo_network
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
  #     interval: 60s
  #     timeout: 10s
  #     retries: 3

networks:
  zo_network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
