version: '3.8'

# Docker Compose para producción con stack completo de monitoring
# Incluye: Prometheus, Grafana, Loki, Promtail, Uptime Kuma, Exporters

services:
  # ==========================================
  # SERVICIOS PRINCIPALES (mismo que docker-compose.yml)
  # ==========================================

  # API REST
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: zo_notifications_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - API_PORT=3000
      - API_KEY_SECRET=${API_KEY_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - MAX_REQUEST_SIZE=${MAX_REQUEST_SIZE:-10mb}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - WEB_PUSH_PUBLIC_KEY=${WEB_PUSH_PUBLIC_KEY}
      - WEB_PUSH_PRIVATE_KEY=${WEB_PUSH_PRIVATE_KEY}
      - WEB_PUSH_EMAIL=${WEB_PUSH_EMAIL}
    depends_on:
      - redis
      - postgres
    networks:
      - zo_network
    volumes:
      - ./api/logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend - React Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zo_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
      - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:3000}
      - VITE_WEB_PUSH_PUBLIC_KEY=${WEB_PUSH_PUBLIC_KEY}
    depends_on:
      - api
    networks:
      - zo_network

  # Worker para Web Push Notifications
  webpush-worker:
    build:
      context: ./workers/webpush-worker
      dockerfile: Dockerfile
    container_name: zo_webpush_worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - WEB_PUSH_PUBLIC_KEY=${WEB_PUSH_PUBLIC_KEY}
      - WEB_PUSH_PRIVATE_KEY=${WEB_PUSH_PRIVATE_KEY}
      - WEB_PUSH_EMAIL=${WEB_PUSH_EMAIL}
      - MAX_PUSH_PER_HOUR=${MAX_PUSH_PER_HOUR:-10}
      - QUIET_HOURS_START=${QUIET_HOURS_START:-22}
      - QUIET_HOURS_END=${QUIET_HOURS_END:-7}
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - redis
      - postgres
    networks:
      - zo_network
    volumes:
      - ./workers/webpush-worker/logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Worker para Discord (opcional - usar profile 'discord')
  discord-worker:
    profiles: ["discord"]
    build:
      context: ./workers/discord-worker
      dockerfile: Dockerfile
    container_name: zo_discord_worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - DISCORD_ERROR_ROLE_ID=${DISCORD_ERROR_ROLE_ID}
      - DISCORD_USERNAME=${DISCORD_USERNAME:-ZO Notifications}
      - DISCORD_AVATAR_URL=${DISCORD_AVATAR_URL}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - redis
    networks:
      - zo_network
    volumes:
      - ./workers/discord-worker/logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Worker para Slack (opcional - usar profile 'slack')
  slack-worker:
    profiles: ["slack"]
    build:
      context: ./workers/slack-worker
      dockerfile: Dockerfile
    container_name: zo_slack_worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_CHANNEL=${SLACK_CHANNEL}
      - SLACK_USERNAME=${SLACK_USERNAME:-ZO Notifications}
      - SLACK_ICON_EMOJI=${SLACK_ICON_EMOJI:-:bell:}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - redis
    networks:
      - zo_network
    volumes:
      - ./workers/slack-worker/logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Worker para Email (opcional - usar profile 'email')
  email-worker:
    profiles: ["email"]
    build:
      context: ./workers/email-worker
      dockerfile: Dockerfile
    container_name: zo_email_worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_SECURE=${EMAIL_SECURE:-false}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_TO=${EMAIL_TO}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - redis
    networks:
      - zo_network
    volumes:
      - ./workers/email-worker/logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis - Queue System
  redis:
    image: redis:7-alpine
    container_name: zo_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - zo_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL - Database
  postgres:
    image: postgres:15-alpine
    container_name: zo_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    networks:
      - zo_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # MONITORING STACK (Prometheus + Grafana + Loki)
  # ==========================================

  # Prometheus - Métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: zo_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - zo_network
    depends_on:
      - api

  # Grafana - Dashboards y visualización
  grafana:
    image: grafana/grafana:latest
    container_name: zo_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - zo_network
    depends_on:
      - prometheus
      - loki

  # Loki - Log aggregation
  loki:
    image: grafana/loki:latest
    container_name: zo_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - zo_network

  # Promtail - Log collector para Loki
  promtail:
    image: grafana/promtail:latest
    container_name: zo_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - zo_network
    depends_on:
      - loki

  # ==========================================
  # EXPORTERS (para métricas adicionales)
  # ==========================================

  # PostgreSQL Exporter - Métricas de PostgreSQL para Prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: zo_postgres_exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    networks:
      - zo_network
    depends_on:
      - postgres

  # Redis Exporter - Métricas de Redis para Prometheus
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: zo_redis_exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - zo_network
    depends_on:
      - redis

  # Node Exporter - Métricas del sistema host
  node-exporter:
    image: prom/node-exporter:latest
    container_name: zo_node_exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - zo_network

  # ==========================================
  # UPTIME MONITORING
  # ==========================================

  # Uptime Kuma - Self-hosted uptime monitoring
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: zo_uptime_kuma
    restart: unless-stopped
    ports:
      - "3002:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - zo_network

  # ==========================================
  # NGINX REVERSE PROXY (Producción con SSL)
  # ==========================================

  nginx:
    image: nginx:alpine
    container_name: zo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
      - grafana
    networks:
      - zo_network

networks:
  zo_network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  uptime_kuma_data:
