<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Bell icon -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Bell shape -->
  <path d="M50 15 C35 15, 30 25, 30 40 L30 55 C30 60, 25 65, 20 68 L80 68 C75 65, 70 60, 70 55 L70 40 C70 25, 65 15, 50 15 Z"
        fill="url(#grad1)" stroke="#1e293b" stroke-width="2"/>

  <!-- Bell clapper -->
  <circle cx="50" cy="68" r="5" fill="#1e293b"/>

  <!-- Bell bottom -->
  <path d="M20 68 Q50 75, 80 68" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Notification badge -->
  <circle cx="70" cy="25" r="12" fill="#ef4444"/>
  <text x="70" y="30" font-size="14" font-weight="bold" fill="white" text-anchor="middle">!</text>
</svg>
