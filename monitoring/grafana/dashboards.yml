# Configuración de provisioning de dashboards para Grafana
apiVersion: 1

providers:
  - name: 'ZO Notifications'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
