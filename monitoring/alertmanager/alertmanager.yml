# Configuración de Alertmanager para ZO Notifications
# Envía alertas a Slack, Discord, y Email

global:
  resolve_timeout: 5m

# Templates personalizados
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Rutas de alerting
route:
  # Configuración por defecto
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'

  # Rutas específicas por severidad
  routes:
    # Alertas críticas -> Slack + Discord
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true

    # Alertas warning -> Solo Slack
    - match:
        severity: warning
      receiver: 'warning-alerts'
      continue: true

    # Alertas de DLQ -> Canal específico
    - match:
        component: dlq
      receiver: 'dlq-alerts'
      continue: true

# Receivers (destinos de alertas)
receivers:
  # Default: Solo logs
  - name: 'default'
    webhook_configs:
      - url: 'http://api:3000/api/v1/webhooks/alerts'
        send_resolved: true

  # Critical: Slack + Discord + Email
  - name: 'critical-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts-critical'
        title: '🚨 ALERTA CRÍTICA - {{ .GroupLabels.alertname }}'
        text: |-
          *Severidad:* {{ .CommonLabels.severity }}
          *Servicio:* {{ .CommonLabels.service }}
          *Descripción:* {{ .CommonAnnotations.description }}
          
          *Detalles:*
          {{ range .Alerts }}
          - {{ .Annotations.summary }}
          {{ end }}
        send_resolved: true

    webhook_configs:
      # Discord webhook
      - url: '${DISCORD_WEBHOOK_URL}'
        send_resolved: true

  # Warning: Solo Slack
  - name: 'warning-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts-warning'
        title: '⚠️ Warning - {{ .GroupLabels.alertname }}'
        text: |-
          *Severidad:* {{ .CommonLabels.severity }}
          *Servicio:* {{ .CommonLabels.service }}
          *Descripción:* {{ .CommonAnnotations.description }}
        send_resolved: true

  # DLQ: Canal específico
  - name: 'dlq-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#dlq-alerts'
        title: '🔄 DLQ Alert - {{ .GroupLabels.alertname }}'
        text: |-
          *Canal:* {{ .CommonLabels.channel }}
          *Descripción:* {{ .CommonAnnotations.description }}
          *Acción:* {{ .CommonAnnotations.summary }}
        send_resolved: true

# Inhibición de alertas (evita spam)
inhibit_rules:
  # Si un servicio está caído, no alertar sobre sus métricas
  - source_match:
      severity: 'critical'
      alertname: 'ServiceDown'
    target_match:
      severity: 'warning'
    equal: ['service']

  # Si el disco está lleno (critical), no alertar sobre disco bajo (warning)
  - source_match:
      severity: 'critical'
      alertname: 'DiskSpaceCritical'
    target_match:
      severity: 'warning'
      alertname: 'DiskSpaceLow'
    equal: ['instance']
