# Configuración de Prometheus para ZO Notifications
global:
  scrape_interval: 15s # Scrape cada 15 segundos
  evaluation_interval: 15s # Evaluar reglas cada 15 segundos
  external_labels:
    monitor: 'zo-notifications'
    environment: 'production'

# Configuración de Alertmanager (opcional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Reglas de alertas (opcional)
# rule_files:
#   - "alerts/*.yml"

# Scrape configs
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API metrics
  - job_name: 'api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:3000']
        labels:
          service: 'api'
          component: 'backend'
    scrape_interval: 10s # API más frecuentemente

  # WebPush Worker metrics (si agregamos endpoint)
  - job_name: 'webpush-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['webpush-worker:3001']
        labels:
          service: 'webpush-worker'
          component: 'worker'
    scrape_interval: 15s

  # Discord Worker metrics (si agregamos endpoint)
  - job_name: 'discord-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['discord-worker:3002']
        labels:
          service: 'discord-worker'
          component: 'worker'
    scrape_interval: 15s

  # PostgreSQL metrics (usando postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          component: 'database'
    scrape_interval: 30s

  # Redis metrics (usando redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'
    scrape_interval: 30s

  # Node Exporter (métricas del sistema)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node'
          component: 'system'
    scrape_interval: 30s
